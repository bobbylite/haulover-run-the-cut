<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost at sea — Run the Cut</title>
    <style>
      html { height: 100%; }
      body { margin: 0; min-height: 100%; display: grid; place-items: center; text-align: center;
        font-family: system-ui, sans-serif; color: #4a3f6b;
        background: linear-gradient(180deg, #ffd9c7 0%, #ffb9a8 38%, #7fd8d2 62%, #2b8fb0 100%); }
      h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .25em; }
      p { margin: 0 0 1.5em; font-size: 1.1rem; }
      a { display: inline-block; padding: .8em 1.6em; border-radius: 999px; color: #fff; text-decoration: none;
        font-weight: 700; background: linear-gradient(90deg, #ff7a6b, #d95ba8); box-shadow: 0 8px 24px #0003; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lost at sea</h1>
      <p>There's nothing at this address.</p>
      <a id="home" href="/">Back to the Cut</a>
    </main>
    <script>
      // Project sites live under /<repo>/; point the button there when we're on github.io.
      var seg = location.pathname.split('/')[1];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
    </script>
  </body>
</html>
